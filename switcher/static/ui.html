<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스위처</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  padding: 36px 20px 60px;
  color: #1a1a2e;
}
h1 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 32px; color: #1a1a2e; letter-spacing: -0.5px; }
h2 { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: #999; margin-bottom: 12px; text-transform: uppercase; }
.section { margin-bottom: 28px; }
.switch-card {
  background: #fff; border-radius: 24px; padding: 24px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
}
.switch-label { font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 14px; }
.device-badge {
  font-size: 12px; color: #888; margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap;
}
.device-badge span { font-weight: 600; color: #1a1a2e; }
.type-badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 10px;
  border-radius: 999px;
  background: #e9f2ff;
  border: 1px solid #cfe3ff;
  color: #2356a8;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2px;
}
.switch-control-area {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.switch-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.switch-row-title {
  font-size: 14px;
  font-weight: 700;
  color: #1a1a2e;
}
.switch-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sw-btn {
  padding: 22px 0; border-radius: 16px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: transform 0.1s, opacity 0.1s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.sw-btn:active { transform: scale(0.95); opacity: 0.8; }
.sw-btn .emoji { font-size: 28px; }
.sw-on  { border: 2px solid #fac775; background: #fff9ee; color: #633806; }
.sw-off { border: 0.5px solid #ddd; background: #f5f5f5; color: #999; opacity: 0.75; }
.battery-row {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 16px; padding-top: 14px;
  border-top: 1px solid #f0f0f0;
}
.battery-btn {
  background: none; border: 1.5px solid #eee; border-radius: 10px;
  padding: 6px 14px; font-size: 13px; color: #888; cursor: pointer;
}
#battery-val { font-size: 13px; font-weight: 600; color: #1a1a2e; min-width: 40px; }

/* 장치 설정 */
.setup-card {
  background: #fff; border-radius: 20px; padding: 20px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
}
.setup-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.setup-title .title-text {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: #999;
  text-transform: uppercase;
}
.setup-title .toggle-icon {
  width: 24px;
  height: 24px;
  border-radius: 999px;
  border: 1px solid #e5e5e5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #7f7f7f;
  font-size: 13px;
  background: #fff;
}
.setup-content {
  margin-top: 12px;
}
.setup-info {
  font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.6;
}
.scan-btn {
  width: 100%; padding: 13px 0; border-radius: 14px;
  border: none; background: #1a1a2e; color: #fff;
  font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 12px;
}
.scan-btn:active { opacity: 0.8; }
.scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.device-list { display: flex; flex-direction: column; gap: 8px; }
.device-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; border-radius: 12px; border: 1.5px solid #eee;
  cursor: pointer; background: #fff; transition: all 0.15s;
}
.device-item:hover { border-color: #1a1a2e; background: #f8f8f8; }
.device-item.selected { border-color: #1a1a2e; background: #f0f4ff; }
.d-name { font-size: 14px; font-weight: 600; color: #1a1a2e; }
.d-addr { font-size: 11px; color: #aaa; margin-top: 2px; font-family: monospace; }
.d-rssi { font-size: 12px; color: #888; }
.save-btn {
  width: 100%; padding: 13px 0; border-radius: 14px; margin-top: 12px;
  border: none; background: #34c759; color: #fff;
  font-size: 15px; font-weight: 700; cursor: pointer;
}
.save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.card {
  background: #fff; border-radius: 20px; padding: 20px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07); margin-bottom: 12px;
}
.tabs { display: flex; background: #f0f2f5; border-radius: 12px; padding: 3px; margin-bottom: 18px; }
.tab {
  flex: 1; text-align: center; padding: 8px 0;
  border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; color: #999; transition: all 0.2s; border: none; background: none;
}
.tab.active { background: #fff; color: #1a1a2e; box-shadow: 0 1px 6px rgba(0,0,0,0.1); }
.days-row { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.day-btn {
  flex: 1; min-width: 36px; padding: 8px 0;
  border-radius: 10px; border: 1.5px solid #eee;
  font-size: 13px; font-weight: 600; cursor: pointer;
  background: #fff; color: #bbb; transition: all 0.15s; text-align: center;
}
.day-btn.selected { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
.preset-row { display: flex; gap: 8px; margin-bottom: 16px; }
.preset-btn {
  flex: 1; padding: 8px 0; border-radius: 10px;
  border: 1.5px solid #eee; background: #fff;
  font-size: 13px; font-weight: 600; color: #666; cursor: pointer;
}
.input-row { display: flex; gap: 8px; align-items: center; }
input[type=time], input[type=number], select {
  flex: 1; padding: 11px 12px; border-radius: 12px;
  border: 1.5px solid #eee; background: #f8f8f8;
  font-size: 15px; color: #1a1a2e; appearance: none;
}
.action-seg { display: flex; border-radius: 12px; overflow: hidden; border: 1.5px solid #eee; flex: 1; }
.action-seg button {
  flex: 1; padding: 11px 0; border: none; background: #f8f8f8;
  font-size: 14px; font-weight: 700; cursor: pointer; color: #bbb;
}
.action-seg button.active-on { background: #fff7e0; color: #f7971e; }
.action-seg button.active-off { background: #f0f0ff; color: #5c5cff; }
.add-btn {
  width: 100%; margin-top: 14px; padding: 13px 0; border-radius: 14px;
  border: none; background: #1a1a2e; color: #fff;
  font-size: 15px; font-weight: 700; cursor: pointer;
}
.add-btn:active { opacity: 0.8; }
.schedule-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 0; border-bottom: 1px solid #f0f0f0;
}
.schedule-item:last-child { border-bottom: none; }
.s-desc { font-size: 14px; font-weight: 600; color: #1a1a2e; }
.s-sub { font-size: 12px; color: #aaa; margin-top: 2px; }
.del-btn {
  background: #fff0f0; border: none; color: #ff6060;
  border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
}
.timer-row { display: flex; gap: 8px; align-items: center; }
#status {
  text-align: center; font-size: 13px; color: #bbb;
  margin-top: 20px; min-height: 18px;
}

/* 장치 미설정 경고 */
.no-device-banner {
  background: #fff8e1; border: 1.5px solid #fac775; border-radius: 16px;
  padding: 16px 20px; margin-bottom: 20px; text-align: center;
  font-size: 14px; color: #8a6000;
}
.no-device-banner strong { display: block; font-size: 15px; margin-bottom: 4px; }
</style>
</head>
<body>
<h1>💡 스위처</h1>

<div id="no-device-banner" style="display:none" class="no-device-banner">
  <strong>⚠️ 장치가 설정되지 않았습니다</strong>
  아래 "장치 설정"에서 스위처를 찾아 연결하세요.
</div>

<div class="section" id="control-section">
  <div class="switch-card">
    <div class="device-badge">
      🔵 연결 장치:
      <span id="device-name-label">-</span>
      <span id="device-type-badge" class="type-badge" style="display:none"></span>
    </div>
    <div id="switch-rows" class="switch-control-area"></div>
    <div class="battery-row">
      <button class="battery-btn" onclick="checkBattery()">🔋 배터리 확인</button>
      <span id="battery-val">-</span>
    </div>
  </div>
</div>

<div class="section">
  <h2 class="setup-title" onclick="toggleSetupSection()">
    <span class="title-text">장치 설정</span>
    <span id="setup-toggle-icon" class="toggle-icon">▾</span>
  </h2>
  <div id="setup-content" class="setup-content">
  <div class="setup-card">
    <div class="setup-info">
      스위처 장치의 전원을 켜고 블루투스 범위(약 10m) 안에 있는지 확인하세요.<br>
      스캔 후 목록에서 장치를 선택하고 저장하면 됩니다.
    </div>
    <button class="scan-btn" id="scan-btn" onclick="startScan()">🔍 주변 장치 스캔 (10초)</button>
    <div id="scan-status" style="font-size:13px;color:#888;text-align:center;margin-bottom:8px;min-height:18px"></div>
    <div class="device-list" id="device-list"></div>
    <button class="save-btn" id="save-btn" onclick="saveDevice()" disabled>저장</button>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f0">
      <div style="font-size:12px;color:#999;margin-bottom:8px;font-weight:600;letter-spacing:1px">기기 종류</div>
      <div style="display:flex;gap:8px">
        <button id="type1-btn" onclick="setDeviceType(1)"
          style="flex:1;padding:10px 0;border-radius:12px;border:2px solid #1a1a2e;background:#1a1a2e;color:#fff;font-size:14px;font-weight:700;cursor:pointer">
          1구
        </button>
        <button id="type2-btn" onclick="setDeviceType(2)"
          style="flex:1;padding:10px 0;border-radius:12px;border:1.5px solid #eee;background:#fff;color:#bbb;font-size:14px;font-weight:700;cursor:pointer">
          2구
        </button>
      </div>
    </div>
  </div>
  </div>
</div>

<div class="section">
  <h2>예약</h2>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('weekday', this)">요일 선택</button>
    <button class="tab" onclick="switchTab('preset', this)">빠른 선택</button>
  </div>
  <div class="card">
    <div id="tab-weekday">
      <div class="days-row">
        <div class="day-btn" onclick="toggleDay(this, 0)">월</div>
        <div class="day-btn" onclick="toggleDay(this, 1)">화</div>
        <div class="day-btn" onclick="toggleDay(this, 2)">수</div>
        <div class="day-btn" onclick="toggleDay(this, 3)">목</div>
        <div class="day-btn" onclick="toggleDay(this, 4)">금</div>
        <div class="day-btn" onclick="toggleDay(this, 5)">토</div>
        <div class="day-btn" onclick="toggleDay(this, 6)">일</div>
      </div>
    </div>
    <div id="tab-preset" style="display:none">
      <div class="preset-row">
        <button class="preset-btn" onclick="setPreset([0,1,2,3,4])">주중</button>
        <button class="preset-btn" onclick="setPreset([5,6])">주말</button>
        <button class="preset-btn" onclick="setPreset([0,1,2,3,4,5,6])">매일</button>
      </div>
      <div class="days-row" id="preset-day-display">
        <div class="day-btn" data-day="0">월</div>
        <div class="day-btn" data-day="1">화</div>
        <div class="day-btn" data-day="2">수</div>
        <div class="day-btn" data-day="3">목</div>
        <div class="day-btn" data-day="4">금</div>
        <div class="day-btn" data-day="5">토</div>
        <div class="day-btn" data-day="6">일</div>
      </div>
    </div>
    <div class="input-row" style="margin-top:4px">
      <input type="time" id="daily-time" value="23:00">
      <div class="action-seg">
        <button id="seg-on" onclick="setAction('on')">ON</button>
        <button id="seg-off" class="active-off" onclick="setAction('off')">OFF</button>
      </div>
    </div>
    <div class="input-row" id="daily-switch-select" style="margin-top:4px;display:none">
      <span style="font-size:13px;color:#999;font-weight:600">스위치:</span>
      <select id="daily-switch-index" style="flex:1">
        <option value="1">스위치 1</option>
        <option value="2">스위치 2</option>
      </select>
    </div>
    <button class="add-btn" onclick="addDaily()">예약 추가</button>
  </div>
</div>

<div class="section">
  <h2>예약 목록</h2>
  <div class="card">
    <div id="schedule-list"><div style="color:#bbb;font-size:14px">예약 없음</div></div>
  </div>
</div>

<div class="section">
  <h2>타이머</h2>
  <div class="card">
    <div class="timer-row">
      <input type="number" id="timer-min" value="30" min="1" max="999" style="max-width:80px">
      <span style="color:#999;font-size:14px;white-space:nowrap">분 후</span>
      <div class="action-seg">
        <button id="tseg-on" onclick="setTimerAction('on')">ON</button>
        <button id="tseg-off" class="active-off" onclick="setTimerAction('off')">OFF</button>
      </div>
    </div>
    <div class="input-row" id="timer-switch-select" style="margin-top:4px;display:none">
      <span style="font-size:13px;color:#999;font-weight:600">스위치:</span>
      <select id="timer-switch-index" style="flex:1">
        <option value="1">스위치 1</option>
        <option value="2">스위치 2</option>
      </select>
    </div>
    <button class="add-btn" onclick="addTimer()">타이머 추가</button>
  </div>
</div>

<div id="status">준비 완료</div>

<script>
let selectedDays = [];
let selectedAction = 'off';
let timerAction = 'off';
let selectedDevice = null;
let deviceType = 1;
const DAY_NAMES = ['월','화','수','목','금','토','일'];

function setSetupCollapsed(collapsed) {
  const content = document.getElementById('setup-content');
  const icon = document.getElementById('setup-toggle-icon');
  if (!content || !icon) return;
  content.style.display = collapsed ? 'none' : '';
  icon.textContent = collapsed ? '▸' : '▾';
}

function toggleSetupSection() {
  const content = document.getElementById('setup-content');
  if (!content) return;
  const collapsed = window.getComputedStyle(content).display === 'none';
  setSetupCollapsed(!collapsed);
}

function setDeviceType(t) {
  deviceType = t;
  document.getElementById('type1-btn').style.cssText = t === 1
    ? 'flex:1;padding:10px 0;border-radius:12px;border:2px solid #1a1a2e;background:#1a1a2e;color:#fff;font-size:14px;font-weight:700;cursor:pointer'
    : 'flex:1;padding:10px 0;border-radius:12px;border:1.5px solid #eee;background:#fff;color:#bbb;font-size:14px;font-weight:700;cursor:pointer';
  document.getElementById('type2-btn').style.cssText = t === 2
    ? 'flex:1;padding:10px 0;border-radius:12px;border:2px solid #1a1a2e;background:#1a1a2e;color:#fff;font-size:14px;font-weight:700;cursor:pointer'
    : 'flex:1;padding:10px 0;border-radius:12px;border:1.5px solid #eee;background:#fff;color:#bbb;font-size:14px;font-weight:700;cursor:pointer';
  renderSwitchRows();
  const dailySelect = document.getElementById('daily-switch-select');
  const timerSelect = document.getElementById('timer-switch-select');
  if (dailySelect) dailySelect.style.display = t === 2 ? '' : 'none';
  if (timerSelect) timerSelect.style.display = t === 2 ? '' : 'none';
}

function renderSwitchRows() {
  const el = document.getElementById('switch-rows');
  if (!el) return;
  const rows = deviceType === 2 ? [1, 2] : [1];
  el.innerHTML = rows.map(idx => {
    const title = deviceType === 2 ? `스위치 ${idx}` : '조명';
    return `
      <div class="switch-row">
        <div class="switch-row-title">${title}</div>
        <div class="switch-btns">
          <button class="sw-btn sw-on" onclick="cmd('on', ${idx})"><span class="emoji">💡</span>ON</button>
          <button class="sw-btn sw-off" onclick="cmd('off', ${idx})"><span class="emoji">🔌</span>OFF</button>
        </div>
      </div>
    `;
  }).join('');
}

function setStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = ok === false ? '#ff6060' : ok === true ? '#34c759' : '#bbb';
  if (ok !== null) setTimeout(() => { el.textContent = '준비 완료'; el.style.color = '#bbb'; }, 2500);
}

async function loadDeviceInfo() {
  const r = await fetch('/config');
  const d = await r.json();
  const label = document.getElementById('device-name-label');
  const badge = document.getElementById('device-type-badge');
  const banner = document.getElementById('no-device-banner');
  if (d.device_address) {
    const typeLabel = d.device_type === 2 ? '2구' : '1구';
    label.textContent = d.device_name || d.device_address;
    badge.textContent = typeLabel;
    badge.style.display = 'inline-flex';
    banner.style.display = 'none';
    deviceType = d.device_type || 1;
    setDeviceType(deviceType);
  } else {
    label.textContent = '없음';
    badge.style.display = 'none';
    banner.style.display = 'block';
    setSetupCollapsed(false);
    setDeviceType(1);
  }
}

async function startScan() {
  const btn = document.getElementById('scan-btn');
  const statusEl = document.getElementById('scan-status');
  const listEl = document.getElementById('device-list');
  btn.disabled = true;
  btn.textContent = '⏳ 스캔 중...';
  statusEl.textContent = '블루투스 장치를 검색하고 있습니다 (10초)...';
  listEl.innerHTML = '';
  selectedDevice = null;
  document.getElementById('save-btn').disabled = true;

  try {
    const r = await fetch('/scan', { method: 'POST' });
    const d = await r.json();
    if (!d.ok) { statusEl.textContent = '❌ 스캔 실패: ' + (d.error || ''); return; }
    const devices = d.devices;
    if (!devices.length) {
      statusEl.textContent = '장치를 찾지 못했습니다. 스위처 전원을 확인하세요.';
      return;
    }
    statusEl.textContent = `${devices.length}개 장치 발견`;
    listEl.innerHTML = devices.map(dev => `
      <div class="device-item" onclick="selectDevice(this, '${dev.address}', '${dev.name.replace(/'/g,"\'")}')">
        <div>
          <div class="d-name">${dev.name}</div>
          <div class="d-addr">${dev.address}</div>
        </div>
        <div class="d-rssi">${dev.rssi != null ? dev.rssi + ' dBm' : ''}</div>
      </div>
    `).join('');
  } catch(e) {
    statusEl.textContent = '❌ 에러: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 다시 스캔';
  }
}

function selectDevice(el, address, name) {
  document.querySelectorAll('.device-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  selectedDevice = { address, name };
  document.getElementById('save-btn').disabled = false;
}

async function saveDevice() {
  if (!selectedDevice) return;
  const r = await fetch('/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ address: selectedDevice.address, name: selectedDevice.name, device_type: deviceType })
  });
  const d = await r.json();
  if (d.ok) {
    const typeStr = deviceType === 2 ? '2구' : '1구';
    setStatus(`✅ "${selectedDevice.name}" (${typeStr}) 저장됨`, true);
    document.getElementById('device-list').innerHTML = '';
    document.getElementById('scan-status').textContent = '';
    selectedDevice = null;
    document.getElementById('save-btn').disabled = true;
    setSetupCollapsed(true);
    loadDeviceInfo();
  } else {
    setStatus('❌ 저장 실패', false);
  }
}

async function cmd(action, index = 1) {
  setStatus('전송 중...', null);
  try {
    const r = await fetch('/switch/' + action + '?index=' + index, {method:'POST'});
    const d = await r.json();
    const target = deviceType === 2 ? `스위치 ${index} ` : '';
    setStatus(d.ok ? (action === 'on' ? `💡 ${target}켜짐` : `🌙 ${target}꺼짐`) : '❌ 실패: ' + (d.error || ''), d.ok);
  } catch(e) { setStatus('❌ 에러', false); }
}

async function checkBattery() {
  const el = document.getElementById('battery-val');
  el.textContent = '조회 중...';
  try {
    const r = await fetch('/battery');
    const d = await r.json();
    if (d.ok) {
      const pct = d.level;
      const icon = pct > 60 ? '🟢' : pct > 20 ? '🟡' : '🔴';
      el.textContent = icon + ' ' + pct + '%';
    } else {
      el.textContent = '❌ ' + (d.error || '실패');
    }
  } catch(e) { el.textContent = '❌ 에러'; }
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-weekday').style.display = name === 'weekday' ? '' : 'none';
  document.getElementById('tab-preset').style.display = name === 'preset' ? '' : 'none';
  selectedDays = [];
}

function toggleDay(el, day) {
  el.classList.toggle('selected');
  if (el.classList.contains('selected')) {
    if (!selectedDays.includes(day)) selectedDays.push(day);
  } else {
    selectedDays = selectedDays.filter(d => d !== day);
  }
}

function setPreset(days) {
  selectedDays = [...days];
  document.querySelectorAll('#preset-day-display .day-btn').forEach(b => {
    b.classList.toggle('selected', days.includes(parseInt(b.dataset.day)));
  });
}

function setAction(a) {
  selectedAction = a;
  document.getElementById('seg-on').className = a === 'on' ? 'active-on' : '';
  document.getElementById('seg-off').className = a === 'off' ? 'active-off' : '';
}

function setTimerAction(a) {
  timerAction = a;
  document.getElementById('tseg-on').className = a === 'on' ? 'active-on' : '';
  document.getElementById('tseg-off').className = a === 'off' ? 'active-off' : '';
}

async function addDaily() {
  if (!selectedDays.length) { setStatus('요일을 선택하세요', false); return; }
  const t = document.getElementById('daily-time').value;
  if (!t) { setStatus('시간을 입력하세요', false); return; }
  const [h, m] = t.split(':').map(Number);
  const idx = deviceType === 2 ? parseInt(document.getElementById('daily-switch-index').value) : 1;
  const r = await fetch('/schedule/daily', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({hour: h, minute: m, action: selectedAction, days: selectedDays, index: idx})
  });
  const d = await r.json();
  const dayStr = selectedDays.sort().map(i => DAY_NAMES[i]).join('');
  setStatus(d.ok ? `📅 [${dayStr}] ${t} ${selectedAction.toUpperCase()} 예약됨` : '❌ 실패', d.ok);
  loadSchedules();
}

async function addTimer() {
  const min = parseInt(document.getElementById('timer-min').value);
  if (!min || min < 1) { setStatus('분을 입력하세요', false); return; }
  const idx = deviceType === 2 ? parseInt(document.getElementById('timer-switch-index').value) : 1;
  const r = await fetch('/schedule/timer', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({minutes: min, action: timerAction, index: idx})
  });
  const d = await r.json();
  setStatus(d.ok ? `⏱ ${min}분 후 ${timerAction.toUpperCase()} 예약됨` : '❌ 실패', d.ok);
  loadSchedules();
}

async function toggleSchedule(id, btn) {
  const r = await fetch('/schedule/' + id + '/toggle', {method:'POST'});
  const d = await r.json();
  if (d.ok) {
    btn.style.background = d.enabled ? '#e8f5e9' : '#f0f0f0';
    btn.style.color = d.enabled ? '#2e7d32' : '#999';
    btn.textContent = d.enabled ? '작동중' : '중단됨';
  }
}

async function deleteSchedule(id) {
  await fetch('/schedule/' + id, {method:'DELETE'});
  loadSchedules();
}

async function loadSchedules() {
  const r = await fetch('/schedules');
  const d = await r.json();
  const el = document.getElementById('schedule-list');
  if (!d.length) { el.innerHTML = '<div style="color:#bbb;font-size:14px">예약 없음</div>'; return; }
  el.innerHTML = d.map(s => {
    let desc, sub;
    if (s.type === 'daily') {
      const dayStr = s.days.sort().map(i => DAY_NAMES[i]).join(' ');
      desc = `${String(s.hour).padStart(2,'0')}:${String(s.minute).padStart(2,'0')} · ${s.action.toUpperCase()}`;
      sub = dayStr;
    } else {
      desc = `⏱ ${s.label}`;
      sub = s.action.toUpperCase();
    }
    return `<div class="schedule-item">
  <div><div class="s-desc">${desc}</div><div class="s-sub">${sub}</div></div>
  <div style="display:flex;gap:6px;align-items:center">
    <button onclick="toggleSchedule(${s.id}, this)"
      style="border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;
      background:${s.enabled !== false ? '#e8f5e9' : '#f0f0f0'};
      color:${s.enabled !== false ? '#2e7d32' : '#999'}">
      ${s.enabled !== false ? '작동중' : '중단됨'}
    </button>
    <button class="del-btn" onclick="deleteSchedule(${s.id})">삭제</button>
  </div>
</div>`;
  }).join('');
}

loadDeviceInfo();
renderSwitchRows();
loadSchedules();
setInterval(loadSchedules, 10000);
</script>
</body>
</html>
